server {
    listen 7001;
    server_name localhost;
    charset utf-8;
    # 开启解压缩静态文件
    gzip_static on;

    # 关闭版本信息
    server_tokens off;

    # nginx日志配置
    #accss_log /var/log/nginx/access.log;
    #error_log /var/log/nginx/error.log;

    # 前端静态资源配置
    location / {
        root /home/dist;
        try_files $uri $uri/ /index.html;
        index index.html index.htm;

        # 添加 CORS 头（确保浏览器能访问自定义头）
        add_header 'Access-Control-Expose-Headers' 'Content-Disposition, Authorization' always;
    }

    # 开发环境代理
    location /dev-api/ {
        # rewrite ^/dev-api/(.*)$ /$1 break;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header REMOTE-HOST $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 如果是在docker中运行，需要使用host.docker.internal访问宿主机
        proxy_pass http://host.docker.internal:8086/;

        # 关键修复：确保传递后端设置的响应头
        proxy_pass_header Content-Disposition;
        proxy_pass_header Set-Cookie;
        proxy_pass_header Authorization;

        # 暴露自定义头给浏览器
        add_header 'Access-Control-Expose-Headers' 'Content-Disposition, Authorization' always;

        # 添加 CORS 支持
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
    }

    # 生产环境代理
    location /prod-api/ {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header REMOTE-HOST $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass http://host.docker.internal:8086/;

        # 关键修复：确保传递后端设置的响应头
        proxy_pass_header Content-Disposition;
        proxy_pass_header Set-Cookie;
        proxy_pass_header Authorization;
        
        # 暴露自定义头给浏览器
        add_header 'Access-Control-Expose-Headers' 'Content-Disposition, Authorization' always;
        
        # 添加 CORS 支持
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
    }

    # 处理 OPTIONS 预检请求
    # location / {
    #     if ($request_method = 'OPTIONS') {
    #         add_header 'Access-Control-Allow-Origin' '*' always;
    #         add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
    #         add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
    #         add_header 'Access-Control-Allow-Credentials' 'true' always;
    #         add_header 'Content-Type' 'text/plain; charset=utf-8';
    #         add_header 'Content-Length' 0;
    #         return 204;
    #     }
    # }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root html;
    }

}

